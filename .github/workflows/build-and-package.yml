name: Build and Package

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev autoconf tmux

    - name: Build neo
      run: |
        ./autogen.sh
        ./configure --prefix=/usr
        make -j$(nproc)

    - name: Run system tests
      run: |
        chmod +x tests/system_test.sh
        ./tests/system_test.sh

    - name: Create Debian package structure
      run: |
        mkdir -p debian-package/neo/DEBIAN
        mkdir -p debian-package/neo/usr/bin
        mkdir -p debian-package/neo/usr/share/man/man6
        mkdir -p debian-package/neo/lib/systemd/system

    - name: Install files to package directory
      run: |
        cp src/neo debian-package/neo/usr/bin/
        cp doc/neo.6 debian-package/neo/usr/share/man/man6/
        gzip debian-package/neo/usr/share/man/man6/neo.6

    - name: Create systemd service file
      run: |
        cat > debian-package/neo/lib/systemd/system/neo.service << 'EOF'
        [Unit]
        Description=Neo Matrix Digital Rain Effect
        After=multi-user.target

        [Service]
        Type=simple
        ExecStart=/usr/bin/neo
        StandardInput=tty
        StandardOutput=tty
        TTYPath=/dev/tty1
        Restart=no

        [Install]
        WantedBy=multi-user.target
        EOF

    - name: Create postinst script
      run: |
        cat > debian-package/neo/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e

        # Enable the service to start at next reboot
        if [ -x /bin/systemctl ]; then
            systemctl enable neo.service || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/postinst

    - name: Create prerm script
      run: |
        cat > debian-package/neo/DEBIAN/prerm << 'EOF'
        #!/bin/bash
        set -e

        # Stop and disable the service before removal
        if [ -x /bin/systemctl ]; then
            systemctl stop neo.service || true
            systemctl disable neo.service || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/prerm

    - name: Get version from configure.ac
      id: get_version
      run: |
        VERSION=$(grep 'AC_INIT' configure.ac | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        echo "VERSION=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT

    - name: Create control file
      run: |
        cat > debian-package/neo/DEBIAN/control << EOF
        Package: neo
        Version: ${{ steps.get_version.outputs.VERSION }}
        Section: misc
        Priority: optional
        Architecture: amd64
        Depends: libncurses6, libc6
        Maintainer: AlphaAqua <your-email@example.com>
        Description: Recreates the digital rain effect from "The Matrix"
         neo recreates the digital rain effect from "The Matrix".
         Streams of random characters will endlessly scroll down your terminal screen.
         .
         Features include:
          - Simulates the effect convincingly
          - Can display custom messages
          - Unicode support
          - Supports 16/256 colors and 32-bit color
          - Fully customizable colors and characters
        EOF

    - name: Build .deb package
      run: |
        dpkg-deb --build debian-package/neo
        mv debian-package/neo.deb neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb

    - name: Upload .deb package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: neo-deb-package
        path: neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb
        body: |
          ## Neo v${{ steps.get_version.outputs.VERSION }}

          **Download the .deb package below to install neo on Debian/Ubuntu systems.**

          ### Installation
          ```bash
          sudo dpkg -i neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb
          ```

          ### Features
          - The neo binary will be installed to `/usr/bin/neo`
          - A systemd service is included and will be enabled to start at next reboot
          - Man page available via `man neo`

          ### Uninstallation
          ```bash
          sudo apt remove neo
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
