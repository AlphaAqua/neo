name: Build and Package

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ alpha ]
  workflow_dispatch:

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            deb_arch: amd64
          - arch: armhf
            runner: ubuntu-24.04-arm
            deb_arch: armhf

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev autoconf tmux

    - name: Install 32-bit build tools for armhf
      if: matrix.arch == 'armhf'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libncurses-dev:armhf libc6-dev:armhf

    - name: Build neo
      run: |
        ./autogen.sh
        if [ "${{ matrix.arch }}" = "armhf" ]; then
          ./configure --prefix=/usr --host=arm-linux-gnueabihf CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++
        else
          ./configure --prefix=/usr
        fi
        make -j$(nproc)

    - name: Run system tests
      run: |
        chmod +x tests/system_test.sh
        ./tests/system_test.sh

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: test-results/junit.xml
        check_name: Neo System Test Results (${{ matrix.arch }})

    - name: Create Debian package structure
      run: |
        mkdir -p debian-package/neo/DEBIAN
        mkdir -p debian-package/neo/usr/bin
        mkdir -p debian-package/neo/usr/share/man/man6
        mkdir -p debian-package/neo/etc/systemd/system/getty@tty1.service.d

    - name: Install files to package directory
      run: |
        cp src/neo debian-package/neo/usr/bin/
        cp doc/neo.6 debian-package/neo/usr/share/man/man6/
        gzip debian-package/neo/usr/share/man/man6/neo.6

    - name: Create getty override configuration
      run: |
        cat > debian-package/neo/etc/systemd/system/getty@tty1.service.d/override.conf << 'EOF'
        [Service]
        ExecStart=
        ExecStart=-/sbin/agetty --autologin neo-user --noclear %I $TERM
        EOF

    - name: Create neo wrapper script
      run: |
        cat > debian-package/neo/usr/bin/neo-session << 'EOF'
        #!/bin/bash
        # Run neo in a loop - if it exits, restart it
        while true; do
            /usr/bin/neo
            sleep 1
        done
        EOF
        chmod 755 debian-package/neo/usr/bin/neo-session

    - name: Create postinst script
      run: |
        cat > debian-package/neo/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e

        # Create neo-user if it doesn't exist
        if ! id -u neo-user >/dev/null 2>&1; then
            useradd -m -s /usr/bin/neo-session neo-user
        else
            # Update shell for existing user
            usermod -s /usr/bin/neo-session neo-user
        fi

        # Reload systemd to pick up the getty override
        if [ -x /bin/systemctl ]; then
            systemctl daemon-reload
            systemctl restart getty@tty1.service || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/postinst

    - name: Create prerm script
      run: |
        cat > debian-package/neo/DEBIAN/prerm << 'EOF'
        #!/bin/bash
        set -e

        # Kill any running neo processes
        pkill -u neo-user || true

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/prerm

    - name: Create postrm script
      run: |
        cat > debian-package/neo/DEBIAN/postrm << 'EOF'
        #!/bin/bash
        set -e

        if [ "$1" = "purge" ]; then
            # Remove neo-user
            if id -u neo-user >/dev/null 2>&1; then
                userdel -r neo-user || true
            fi

            # Remove getty override directory if empty
            if [ -d /etc/systemd/system/getty@tty1.service.d ]; then
                rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d || true
            fi

            # Reload systemd and restart getty
            if [ -x /bin/systemctl ]; then
                systemctl daemon-reload
                systemctl restart getty@tty1.service || true
            fi
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/postrm

    - name: Get version from tag or configure.ac
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Extract version from tag (remove 'v' prefix if present)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
        else
          # Fall back to configure.ac version
          VERSION=$(grep 'AC_INIT' configure.ac | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        fi
        echo "VERSION=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT

    - name: Create control file
      run: |
        cat > debian-package/neo/DEBIAN/control << EOF
        Package: neo
        Version: ${{ steps.get_version.outputs.VERSION }}
        Section: misc
        Priority: optional
        Architecture: ${{ matrix.deb_arch }}
        Depends: libncurses6, libc6
        Maintainer: https://github.com/st3w/neo
        Description: Recreates the digital rain effect from "The Matrix"
         neo recreates the digital rain effect from "The Matrix".
         Streams of random characters will endlessly scroll down your terminal screen.
         .
         Features include:
          - Simulates the effect convincingly
          - Can display custom messages
          - Unicode support
          - Supports 16/256 colors and 32-bit color
          - Fully customizable colors and characters
        EOF

    - name: Build .deb package
      run: |
        dpkg-deb --build debian-package/neo
        mkdir -p dist
        mv debian-package/neo.deb ./dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb

    - name: Upload .deb package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: neo-deb-package-${{ matrix.arch }}
        path: dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb
        body: |
          ## Neo v${{ steps.get_version.outputs.VERSION }}

          **Download the .deb package below to install neo on Debian/Ubuntu systems.**

          ### Installation
          ```bash
          sudo dpkg -i neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb
          ```

          ### Features
          - The neo binary will be installed to `/usr/bin/neo`
          - Autologin configured on tty1 to display neo at boot
          - Man page available via `man neo`

          ### Uninstallation
          ```bash
          sudo apt remove neo
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
