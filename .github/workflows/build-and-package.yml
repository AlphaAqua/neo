name: Build and Package

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ alpha ]
  workflow_dispatch:

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            deb_arch: amd64
          - arch: armhf
            runner: ubuntu-24.04-arm
            deb_arch: armhf

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev autoconf tmux

    - name: Install 32-bit build tools for armhf
      if: matrix.arch == 'armhf'
      run: |
        sudo dpkg --add-architecture armhf
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libncurses-dev:armhf libc6-dev:armhf

    - name: Build neo
      run: |
        ./autogen.sh
        if [ "${{ matrix.arch }}" = "armhf" ]; then
          ./configure --prefix=/usr --host=arm-linux-gnueabihf CC=arm-linux-gnueabihf-gcc CXX=arm-linux-gnueabihf-g++
        else
          ./configure --prefix=/usr
        fi
        make -j$(nproc)

    - name: Run system tests
      run: |
        chmod +x tests/system_test.sh
        ./tests/system_test.sh

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: test-results/junit.xml
        check_name: Neo System Test Results (${{ matrix.arch }})

    - name: Create Debian package structure
      run: |
        mkdir -p debian-package/neo/DEBIAN
        mkdir -p debian-package/neo/usr/bin
        mkdir -p debian-package/neo/usr/share/man/man6
        mkdir -p debian-package/neo/etc/init.d

    - name: Install files to package directory
      run: |
        cp src/neo debian-package/neo/usr/bin/
        cp doc/neo.6 debian-package/neo/usr/share/man/man6/
        gzip debian-package/neo/usr/share/man/man6/neo.6

    - name: Create init.d script
      run: |
        cat > debian-package/neo/etc/init.d/neo << 'EOF'
        #!/bin/bash
        ### BEGIN INIT INFO
        # Provides:          neo
        # Required-Start:    $local_fs $remote_fs
        # Required-Stop:     $local_fs $remote_fs
        # Default-Start:     2 3 4 5
        # Default-Stop:      0 1 6
        # Short-Description: Neo Matrix Digital Rain on Console
        # Description:       Displays Matrix digital rain effect on tty1
        ### END INIT INFO

        case "$1" in
          start)
            # Run neo on tty1 in background, redirecting to the console
            openvt -c 1 -f -s -- /usr/bin/neo &
            ;;
          stop)
            # Kill neo processes
            pkill -f "^/usr/bin/neo" || true
            ;;
          restart)
            $0 stop
            sleep 1
            $0 start
            ;;
          *)
            echo "Usage: $0 {start|stop|restart}"
            exit 1
            ;;
        esac

        exit 0
        EOF
        chmod 755 debian-package/neo/etc/init.d/neo

    - name: Create postinst script
      run: |
        cat > debian-package/neo/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e

        # Enable the init.d script to start at boot
        if [ -x /usr/sbin/update-rc.d ]; then
            update-rc.d neo defaults || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/postinst

    - name: Create prerm script
      run: |
        cat > debian-package/neo/DEBIAN/prerm << 'EOF'
        #!/bin/bash
        set -e

        # Stop neo and disable the init.d script
        if [ -x /etc/init.d/neo ]; then
            /etc/init.d/neo stop || true
        fi
        if [ -x /usr/sbin/update-rc.d ]; then
            update-rc.d -f neo remove || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/prerm

    - name: Get version from tag or configure.ac
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          # Extract version from tag (remove 'v' prefix if present)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
        else
          # Fall back to configure.ac version
          VERSION=$(grep 'AC_INIT' configure.ac | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        fi
        echo "VERSION=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT

    - name: Create control file
      run: |
        cat > debian-package/neo/DEBIAN/control << EOF
        Package: neo
        Version: ${{ steps.get_version.outputs.VERSION }}
        Section: misc
        Priority: optional
        Architecture: ${{ matrix.deb_arch }}
        Depends: libncurses6, libc6
        Maintainer: https://github.com/st3w/neo
        Description: Recreates the digital rain effect from "The Matrix"
         neo recreates the digital rain effect from "The Matrix".
         Streams of random characters will endlessly scroll down your terminal screen.
         .
         Features include:
          - Simulates the effect convincingly
          - Can display custom messages
          - Unicode support
          - Supports 16/256 colors and 32-bit color
          - Fully customizable colors and characters
        EOF

    - name: Build .deb package
      run: |
        dpkg-deb --build debian-package/neo
        mkdir -p dist
        mv debian-package/neo.deb ./dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb

    - name: Upload .deb package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: neo-deb-package-${{ matrix.arch }}
        path: dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb
        body: |
          ## Neo v${{ steps.get_version.outputs.VERSION }}

          **Download the .deb package below to install neo on Debian/Ubuntu systems.**

          ### Installation
          ```bash
          sudo dpkg -i neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb
          ```

          ### Features
          - The neo binary will be installed to `/usr/bin/neo`
          - A systemd service is included and will be enabled to start at next reboot
          - Man page available via `man neo`

          ### Uninstallation
          ```bash
          sudo apt remove neo
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
