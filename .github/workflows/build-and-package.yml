name: Build and Package

on:
  push:
    branches: [ '**' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, armhf]
        include:
          - arch: amd64
            deb_arch: amd64
            cc: gcc
            cxx: g++
          - arch: armhf
            deb_arch: armhf
            cc: arm-linux-gnueabihf-gcc
            cxx: arm-linux-gnueabihf-g++

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev autoconf tmux

    - name: Install cross-compilation tools for armhf
      if: matrix.arch == 'armhf'
      run: |
        sudo dpkg --add-architecture armhf
        # Backup sources.list
        sudo cp /etc/apt/sources.list /etc/apt/sources.list.backup
        # Restrict only archive.ubuntu.com to amd64, keeping security.ubuntu.com unrestricted
        sudo sed -i 's|^deb http://archive.ubuntu.com|deb [arch=amd64] http://archive.ubuntu.com|g' /etc/apt/sources.list
        sudo sed -i 's|^deb https://archive.ubuntu.com|deb [arch=amd64] https://archive.ubuntu.com|g' /etc/apt/sources.list
        # Restrict security.ubuntu.com to amd64 only (armhf will come from ports)
        sudo sed -i 's|^deb http://security.ubuntu.com|deb [arch=amd64] http://security.ubuntu.com|g' /etc/apt/sources.list
        sudo sed -i 's|^deb https://security.ubuntu.com|deb [arch=amd64] https://security.ubuntu.com|g' /etc/apt/sources.list
        # Only modify Ubuntu-related list files in sources.list.d
        sudo find /etc/apt/sources.list.d -name "ubuntu*.list" -exec sed -i 's|^deb \(http\)|deb [arch=amd64] \1|g' {} \;
        sudo find /etc/apt/sources.list.d -name "ubuntu*.list" -exec sed -i 's|^deb \(https\)|deb [arch=amd64] \1|g' {} \;
        # Add ARM ports repository for armhf packages
        sudo tee /etc/apt/sources.list.d/armhf.list >/dev/null <<EOF
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe restricted multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-updates main universe restricted multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-security main universe restricted multiverse
        deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs)-backports main universe restricted multiverse
        EOF
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libncurses-dev:armhf

    - name: Build neo
      run: |
        ./autogen.sh
        ./configure --prefix=/usr --host=${{ matrix.arch == 'armhf' && 'arm-linux-gnueabihf' || 'x86_64-linux-gnu' }} CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
        make -j$(nproc)

    - name: Run system tests
      if: matrix.arch == 'amd64'
      run: |
        chmod +x tests/system_test.sh
        ./tests/system_test.sh

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && matrix.arch == 'amd64'
      with:
        files: test-results/junit.xml
        check_name: Neo System Test Results

    - name: Create Debian package structure
      run: |
        mkdir -p debian-package/neo/DEBIAN
        mkdir -p debian-package/neo/usr/bin
        mkdir -p debian-package/neo/usr/share/man/man6
        mkdir -p debian-package/neo/lib/systemd/system

    - name: Install files to package directory
      run: |
        cp src/neo debian-package/neo/usr/bin/
        cp doc/neo.6 debian-package/neo/usr/share/man/man6/
        gzip debian-package/neo/usr/share/man/man6/neo.6

    - name: Create systemd service file
      run: |
        cat > debian-package/neo/lib/systemd/system/neo.service << 'EOF'
        [Unit]
        Description=Neo Matrix Digital Rain Effect
        After=multi-user.target

        [Service]
        Type=simple
        ExecStart=/usr/bin/neo
        StandardInput=tty
        StandardOutput=tty
        TTYPath=/dev/tty1
        Restart=no

        [Install]
        WantedBy=multi-user.target
        EOF

    - name: Create postinst script
      run: |
        cat > debian-package/neo/DEBIAN/postinst << 'EOF'
        #!/bin/bash
        set -e

        # Enable the service to start at next reboot
        if [ -x /bin/systemctl ]; then
            systemctl enable neo.service || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/postinst

    - name: Create prerm script
      run: |
        cat > debian-package/neo/DEBIAN/prerm << 'EOF'
        #!/bin/bash
        set -e

        # Stop and disable the service before removal
        if [ -x /bin/systemctl ]; then
            systemctl stop neo.service || true
            systemctl disable neo.service || true
        fi

        exit 0
        EOF
        chmod 755 debian-package/neo/DEBIAN/prerm

    - name: Get version from configure.ac
      id: get_version
      run: |
        VERSION=$(grep 'AC_INIT' configure.ac | sed -n 's/.*\[\([0-9.]*\)\].*/\1/p')
        echo "VERSION=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT

    - name: Create control file
      run: |
        cat > debian-package/neo/DEBIAN/control << EOF
        Package: neo
        Version: ${{ steps.get_version.outputs.VERSION }}
        Section: misc
        Priority: optional
        Architecture: ${{ matrix.deb_arch }}
        Depends: libncurses6, libc6
        Maintainer: AlphaAqua <your-email@example.com>
        Description: Recreates the digital rain effect from "The Matrix"
         neo recreates the digital rain effect from "The Matrix".
         Streams of random characters will endlessly scroll down your terminal screen.
         .
         Features include:
          - Simulates the effect convincingly
          - Can display custom messages
          - Unicode support
          - Supports 16/256 colors and 32-bit color
          - Fully customizable colors and characters
        EOF

    - name: Build .deb package
      run: |
        dpkg-deb --build debian-package/neo
        mkdir -p dist
        mv debian-package/neo.deb ./dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb

    - name: Upload .deb package as artifact
      uses: actions/upload-artifact@v4
      with:
        name: neo-deb-package-${{ matrix.arch }}
        path: dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb
        retention-days: 90

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/neo_${{ steps.get_version.outputs.VERSION }}_${{ matrix.deb_arch }}.deb
        body: |
          ## Neo v${{ steps.get_version.outputs.VERSION }}

          **Download the .deb package below to install neo on Debian/Ubuntu systems.**

          ### Installation
          ```bash
          sudo dpkg -i neo_${{ steps.get_version.outputs.VERSION }}_amd64.deb
          ```

          ### Features
          - The neo binary will be installed to `/usr/bin/neo`
          - A systemd service is included and will be enabled to start at next reboot
          - Man page available via `man neo`

          ### Uninstallation
          ```bash
          sudo apt remove neo
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
